name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "modiriat_tamirgah_royal_navy_buttons_fixed.py"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "RoyalRepairShop" "modiriat_tamirgah_royal_navy_buttons_fixed.py"
          if (!(Test-Path "dist/RoyalRepairShop.exe")) { throw "EXE was not created" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RoyalRepairShop-Windows-EXE
          path: dist/RoyalRepairShop.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: Royal Repair Shop - Latest Windows EXE
          body: Automatically built Windows executable. Download RoyalRepairShop.exe.
          files: dist/RoyalRepairShop.exe
          make_latest: false

name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RoyalRepairShop modiriat_tamirgah_royal_navy_buttons_fixed.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RoyalRepairShop-Windows-EXE
          path: dist/RoyalRepairShop.exe
          if-no-files-found: error
          retention-days: 14

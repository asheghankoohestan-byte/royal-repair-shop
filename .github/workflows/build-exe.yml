name: Build and publish Royal Repair Shop

on:
  push:
    branches: [main]
    paths:
      - "modiriat_tamirgah_royal_navy_buttons_fixed.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RoyalRepairShop modiriat_tamirgah_royal_navy_buttons_fixed.py
      - name: Publish release and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.3.2"
          $tag = "v$version"
          $exePath = "dist/RoyalRepairShop.exe"
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourcePath = "modiriat_tamirgah_royal_navy_buttons_fixed.py"
          $sourceHash = (Get-FileHash $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseUrl = "https://github.com/asheghankoohestan-byte/royal-repair-shop/releases/download/$tag/RoyalRepairShop.exe"
          $sourceUrl = "https://raw.githubusercontent.com/asheghankoohestan-byte/royal-repair-shop/main/$sourcePath?v=$version"
          gh release create $tag $exePath --target $env:GITHUB_SHA --title "Royal Repair Shop $version" --notes "نسخه $version: اصلاح خطای صفحه اصلی، فشرده‌سازی پنل اصلی و بهبود به‌روزرسان خودکار نسخه EXE."
          if ($LASTEXITCODE -ne 0) { throw "ساخت Release ناموفق بود." }
          $manifest = [ordered]@{
            version = $version
            exe_file = "RoyalRepairShop.exe"
            exe_url = $releaseUrl
            exe_sha256 = $exeHash
            source_file = $sourcePath
            source_url = $sourceUrl
            source_sha256 = $sourceHash
            changelog = @(
              "فشرده‌تر شدن صفحه اصلی برای نمایش بهتر بخش‌ها",
              "اصلاح هشدار موجودی و خطای چیدمان صفحه اصلی",
              "بهبود به‌روزرسان خودکار برای جایگزینی نسخه EXE همراه با حفظ پایگاه داده"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "version.json" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish updater manifest $version"
          git push origin HEAD:main
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoyalRepairShop-Windows-EXE
          path: dist/RoyalRepairShop.exe
          if-no-files-found: error
          retention-days: 14
